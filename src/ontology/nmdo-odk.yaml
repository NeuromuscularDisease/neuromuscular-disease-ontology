id: nmdo
title: "Neuromuscular Disease Ontology"
description: "A project ontology designed to support the integration and mapping of neuromuscular disease data in patient registries."
license: https://creativecommons.org/publicdomain/zero/1.0/
github_org: NeuromuscularDisease
repo: neuromuscular-disease-ontology
git_main_branch: main
#uribase: https://w3id.org
create_obo_metadata: TRUE
remove_owl_nothing: TRUE
release_artefacts: 
  - full
#  - base
primary_release: full
edit_format: obo
export_formats:
  - owl
  - obo
  - json
use_templates: TRUE
use_context: TRUE
import_group:
  use_base_merging: TRUE
  mirror_max_time_download: 500
  annotation_properties:
    - rdfs:label
    - IAO:0000115   # definition
    - IAO:0000116   # editor note
    - IAO:0000111   # editor preferred term
    - oboInOwl:hasDbXref
    - oboInOwl:source
    - rdfs:comment
    - rdfs:seeAlso
    - oboInOwl:hasAlternativeId
    - oboInOwl:hasBroadSynonym
    - oboInOwl:hasExactSynonym
    - oboInOwl:hasNarrowSynonym
    - oboInOwl:hasRelatedSynonym
    - oboInOwl:hasSynonymType
    - oboInOwl:SynonymTypeProperty
    - skos:broadMatch
    - skos:closeMatch
    - skos:exactMatch
    - skos:narrowMatch
    - skos:relatedMatch
    - owl:deprecated
    - IAO:0000231   # has obsolescence reason
    - IAO:0100001   # term replaced by
    - oboInOwl:consider
    - NCIT:P378   # Definition Source
    - NCIT:P383   # Term Type
    - NCIT:P384   # Term Source
    - NCIT:P207   # UMLS_CUI
  exclude_iri_patterns:
    - <http://purl.obolibrary.org/obo/BFO_*>
    - <http://purl.obolibrary.org/obo/CHEBI_*>
    - <http://purl.obolibrary.org/obo/CHR_*>
    - <http://purl.obolibrary.org/obo/CL_*>
    - <http://purl.obolibrary.org/obo/CLM_*>
    - <http://purl.obolibrary.org/obo/ECTO_*>
    - <http://purl.obolibrary.org/obo/GO_*>
    - <http://purl.obolibrary.org/obo/HsapDv_*>
    - <http://purl.obolibrary.org/obo/MAXO_*>
    - <http://purl.obolibrary.org/obo/MF_*>
    - <http://purl.obolibrary.org/obo/NBO_*>
    - <http://purl.obolibrary.org/obo/NCBITaxon_*>
    - <http://purl.obolibrary.org/obo/PR_*>
    - <https://bioregistry.io/*>
    - <http://purl.uniprot.org/uniprot/*>
    - <http://www.informatics.jax.org/accession/MGI*>
    - <http://rgd.mcw.edu/rgdweb/report/gene/*>
    - <http://identifiers.org/ncbigene/*>
  module_type: slme
  module_type_slme: STAR
  slme_individuals: exclude
  products: 
    - id: hgnc
      mirror_from: https://w3id.org/biopragmatics/resources/hgnc/hgnc.ofn
      module_type: filter
      base_iris:
        - "https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/"
    - id: hp
      use_base: TRUE
    - id: iao
      module_type: filter
      base_iris:
        - IAO
    - id: mondo
      use_base: TRUE
    - id: ncit
      is_large: TRUE
      mirror_from: https://evs.nci.nih.gov/ftp1/rdf/Thesaurus.owl
      make_base: TRUE
      base_iris:
        - http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#
    - id: omo
      module_type: filter
    - id: pato
      module_type: filter
    - id: ro
      module_type: filter
    - id: so
      module_type: filter
    - id: uberon
      mirror_from: http://purl.obolibrary.org/obo/uberon/subsets/human-view.owl
      module_type: filter
      base_iris:
        - UBERON
components:
  products:
    - filename: nmdo_extra.owl
      use_template: TRUE
      template_options: --input imports/merged_import.owl
      templates:
        - nmdo.tsv
robot_report:
  use_labels: TRUE
  fail_on: none
  report_on:
    - edit
robot_java_args: '-Xmx16G'
documentation:
  documentation_system: mkdocs